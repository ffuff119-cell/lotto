<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로또 6/45 번호 추첨기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Orbitron:wght@700;900&display=swap">
<style>
:root{
  --gold:#ffd45a; --text:#eef1ff; --muted:#9aa5d1; --line:rgba(255,255,255,.12);
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bs:clamp(32px,10.5vw,50px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--text); min-height:100vh; overflow-x:hidden;
  background:radial-gradient(1100px 650px at 50% -10%,#2b3684 0%,transparent 62%),linear-gradient(180deg,#141a44,#080b1e);
  background-color:#080b1e; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:600px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;color:var(--text);background:rgba(255,255,255,.1);transition:transform .1s,filter .2s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(180deg,#ffe07a,#f5b400);color:#2a1c00;box-shadow:0 6px 18px rgba(245,180,0,.28)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.topbar h1{font-size:18px;font-weight:900;margin:0;letter-spacing:-.3px}
.marquee{position:relative;height:46px;border-radius:10px;background:#140606;border:3px solid #2b2f3a;box-shadow:inset 0 0 12px #000,0 4px 14px rgba(0,0,0,.5);overflow:hidden;margin-bottom:6px}
.marquee-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;animation:scrollx var(--dur,14s) linear infinite;will-change:transform}
.marquee-track span{font:800 26px/1 var(--font);color:#ffb627;text-shadow:0 0 6px #ff8a00,0 0 14px rgba(255,120,0,.7);letter-spacing:2px}
.marquee::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 1.1px,rgba(12,0,0,.82) 1.7px) 0 0/4px 4px;pointer-events:none}
@keyframes scrollx{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.stage{position:relative;display:flow-root;padding-bottom:16px}
#machine{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.mbody{position:relative;z-index:1;border-radius:20px;padding:18px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.04) 1px 3px),linear-gradient(180deg,#eef1f5 0%,#bfc6cf 14%,#8f98a4 52%,#c5cbd3 86%,#717985 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.45)}
.mbody::before{content:'';position:absolute;inset:8px;pointer-events:none;
  background:radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) left top/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) right top/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) left bottom/8px 8px no-repeat,
  radial-gradient(circle,#fafcff 0 1px,#7a828e 2.5px,transparent 3.2px) right bottom/8px 8px no-repeat}
.panel{width:100%;max-width:320px;background:linear-gradient(180deg,#1b1f27,#2c323d);border-radius:14px;padding:10px 12px 8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.6);text-align:center}
.dlabel{font-size:12px;letter-spacing:3px;color:#8fa0b8;font-weight:800}
.drow{display:flex;align-items:center;justify-content:center;gap:12px;margin:7px 0}
.step{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:900;color:#2b2f36;line-height:1;padding:0;background:radial-gradient(circle at 40% 30%,#fff,#c9cfd7 60%,#8b939e);box-shadow:0 3px 0 #555c66,0 5px 10px rgba(0,0,0,.4)}
.step:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #555c66}
.step:disabled{opacity:.45;cursor:not-allowed}
.display{position:relative;width:118px;height:62px;border-radius:10px;background:#050d07;border:2px solid #000;box-shadow:inset 0 0 14px rgba(0,0,0,.9),0 0 0 3px #3a414c;transition:box-shadow .2s}
.display::before{content:'8';position:absolute;inset:0;display:grid;place-items:center;font:900 36px 'Orbitron',monospace;color:rgba(72,255,122,.07);pointer-events:none}
.display input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font:900 36px 'Orbitron',monospace;color:#4dff7c;text-shadow:0 0 8px rgba(77,255,124,.8),0 0 18px rgba(77,255,124,.4);outline:none;caret-color:#4dff7c;padding:0}
.display input:disabled{opacity:.55}
.display.err{box-shadow:inset 0 0 14px rgba(0,0,0,.9),0 0 0 3px #ff4d4d}
.display.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.remain{font-size:13px;color:#cbd5e1;font-weight:700}
.msg{min-height:20px;font-size:13px;font-weight:700;color:var(--gold);margin-top:3px;line-height:1.4}
.msg.err{color:#ff8a8a}
.speed{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#2b2f36;cursor:pointer;user-select:none}
.speed input{width:18px;height:18px;accent-color:#e0102f}
.start-btn{width:min(100%,260px);border:0;border-radius:999px;padding:16px 20px;font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);
  background:radial-gradient(circle at 50% 25%,#ff7b7b,#e0102f 58%,#93001a);box-shadow:0 6px 0 #6b0010,0 12px 22px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.start-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #6b0010,0 6px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.mbody.rattle{animation:rattle .11s linear infinite}
@keyframes rattle{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.4px)}50%{transform:translate(-.5px,.5px)}75%{transform:translate(.4px,.3px)}100%{transform:translate(0,0)}}
.start-btn:disabled{filter:grayscale(.85) brightness(.85);cursor:not-allowed}

.tray-wrap{position:relative;background:linear-gradient(180deg,#0e1430,#141b3d);border-radius:18px;padding:14px 12px 16px;border:1px solid var(--line);box-shadow:inset 0 6px 16px rgba(0,0,0,.5)}
.tray-wrap::before{content:'';position:absolute;top:-6px;right:calc(var(--chute,30px) - 24px);width:48px;height:12px;border-radius:0 0 12px 12px;background:linear-gradient(90deg,#666e79,#e6eaee,#7a828e)}
.tray-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px;letter-spacing:1px}
.tray{display:flex;flex-direction:column;gap:12px;min-height:80px}
.tray-empty{width:100%;text-align:center;color:#5d6894;font-size:14px;padding:24px 0}
.game{background:rgba(255,255,255,.035);border-radius:14px;padding:8px 8px 6px;animation:fadeIn .35s both}
.grow{display:flex;align-items:center;gap:6px;justify-content:center}
.glabel{flex:none;width:22px;height:22px;border-radius:6px;background:var(--gold);color:#2a1c00;font-weight:900;font-size:13px;display:grid;place-items:center}
.nums{display:flex;gap:3px}
.slot{width:var(--bs);height:var(--bs);border-radius:50%;border:2px dashed rgba(255,255,255,.14);flex:none;position:relative}
.slot.filled{border:0}
.lb{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,var(--c) 55%,var(--d) 100%);box-shadow:0 4px 8px rgba(0,0,0,.45)}
.lb::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse 22% 15% at 31% 24%,rgba(255,255,255,.85),rgba(255,255,255,0)),radial-gradient(circle at 36% 30%,rgba(255,255,255,.25),rgba(255,255,255,0) 45%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(0,0,0,.3) 100%)}
.lb span{width:66%;height:66%;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:#1d1d1f;font-weight:900;font-size:calc(var(--bs) * .34);line-height:1}
.lb.arrive{animation:pop .7s cubic-bezier(.3,1.4,.5,1) both}
.lb.glow{box-shadow:0 0 0 3px rgba(255,212,90,.9),0 0 18px rgba(255,212,90,.8)}
@keyframes pop{0%{transform:translateY(-22px) scale(.3);opacity:0}40%{transform:scale(1.5);opacity:1}62%{transform:scale(.88)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.order{font-size:11.5px;color:#7480b0;text-align:center;margin-top:5px;min-height:15px}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.note{text-align:center;color:#68739e;font-size:12px;margin-top:14px;line-height:1.5}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:rgba(20,24,48,.95);border:1px solid var(--line);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:641px){ #app{padding-top:28px} .nums{gap:5px} .grow{gap:8px} }

/* 휴대폰: 스크롤 없이 한 화면 */
@media (max-width:640px){
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;
    padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom))}
  .topbar{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);margin:0}
  .marquee{flex:none;height:34px;margin:0;border-width:2px}
  .marquee-track span{font-size:19px}
  .stage{flex:1 1 0;min-height:260px;padding:0}
  .mbody{position:absolute;left:0;bottom:10px;margin:0!important;padding:10px 12px;
    display:grid;grid-template-columns:auto 1fr;grid-template-areas:"drow start" "msg speed";gap:6px 10px;align-items:center}
  .panel{display:contents}
  .dlabel,.remain{display:none}
  .drow{grid-area:drow;margin:0;gap:7px}
  .step{width:34px;height:34px;font-size:20px}
  .display{width:58px;height:44px}
  .display::before,.display input{font-size:28px}
  .start-btn{grid-area:start;width:100%;padding:11px 6px;font-size:16px;letter-spacing:0}
  .msg{grid-area:msg;margin:0;min-height:17px;font-size:12px;color:#26324f;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg.err{color:#b00020}
  .speed{grid-area:speed;justify-self:end;font-size:12px;white-space:nowrap}
  .speed input{width:15px;height:15px}
  :root{--bs:clamp(28px,9.4vw,38px)}
  .tray-wrap{flex:none;padding:7px 9px 8px;border-radius:14px}
  .tray-head{margin-bottom:5px;font-size:12px}
  .tray{gap:6px;min-height:calc(var(--bs) + 12px + (var(--rows,1) - 1) * 40px)}
  .tray-empty{padding:10px 0;font-size:13px}
  .game{padding:6px}
  .game.done{--bs:22px}
  .game.done .lb span{font-size:9.5px}
  .order{display:none}
  .actions{flex:none;margin:0;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
  .actions .wide{grid-column:auto}
  .actions .btn{padding:11px 8px;font-size:14px}
  .note{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>로또 6/45 번호 추첨기</h1>
  </div>
  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

  <div id="stage" class="stage">
    <canvas id="machine" aria-hidden="true"></canvas>
    <div id="mbody" class="mbody">
      <div class="panel">
        <div class="dlabel">게임 수</div>
        <div class="drow">
          <button type="button" class="step" id="minusBtn" aria-label="1게임 줄이기">−</button>
          <div class="display" id="displayWrap">
            <input id="countIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" value="1" autocomplete="off" aria-label="게임 수 (1~5)" aria-describedby="remainText msg">
          </div>
          <button type="button" class="step" id="plusBtn" aria-label="1게임 늘리기">+</button>
        </div>
        <div class="remain" id="remainText">1게임 = 번호 6개 · 최대 5게임</div>
        <div class="msg" id="msg"></div>
      </div>
      <label class="speed"><input type="checkbox" id="fastChk"> 빠르게 추첨</label>
      <button type="button" id="startBtn" class="start-btn">추첨 시작</button>
    </div>
  </div>

  <div class="tray-wrap" id="trayWrap">
    <div class="tray-head"><span>추첨 결과</span><span id="trayCount"></span></div>
    <div id="tray" class="tray"></div>
  </div>

  <div class="actions">
    <button type="button" id="saveBtn" class="btn primary">이미지 저장</button>
    <button type="button" id="shareBtn" class="btn primary hidden">공유</button>
    <button type="button" id="copyBtn" class="btn ghost">결과 복사</button>
  </div>
  <p class="note">게임마다 1~45 중 6개를 무작위 비복원 추첨합니다.<br>재미로 뽑는 번호이며 실제 당첨 확률과는 무관합니다.</p>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= 공통 ================= */
const $ = s => document.querySelector(s);
const FONT = '"Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const COLORS = [
  { base:'#f6c000', light:'#ffe680', dark:'#a87a00' }, // 1~10 노랑
  { base:'#1f6fe5', light:'#7fb0ff', dark:'#0b3a85' }, // 11~20 파랑
  { base:'#e53935', light:'#ff8f8a', dark:'#8e1512' }, // 21~30 빨강
  { base:'#8d939c', light:'#d5d9df', dark:'#4a4f57' }, // 31~40 회색
  { base:'#25a748', light:'#7fe39a', dark:'#0e5d24' }  // 41~45 초록
];
const MAX_NUM = 45, PICK = 6, MAX_GAMES = 5;
const GAME_LABELS = ['A', 'B', 'C', 'D', 'E'];
const colorOf = n => n <= 10 ? 0 : n <= 20 ? 1 : n <= 30 ? 2 : n <= 40 ? 3 : 4;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const wrapAngle = a => ((a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;

/* 암호학적 난수 + Fisher–Yates */
function randInt(n){
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / n) * n;
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
  return x % n;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function ensureFonts(text){
  if (!document.fonts) return;
  const t = text || '가';
  const loads = [400, 500, 700, 800, 900].map(w => document.fonts.load(`${w} 40px "Pretendard Variable"`, t).catch(() => {}));
  loads.push(document.fonts.load(`700 40px "Noto Sans KR"`, t).catch(() => {}));
  await Promise.race([Promise.all(loads), sleep(2500)]);
  await Promise.race([document.fonts.ready, sleep(2500)]);
}

let toastTimer;
function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function announce(t){ const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = t; }, 30); }


/* ================= 로또기계 ================= */
const stage = $('#stage'), canvas = $('#machine'), ctx = canvas.getContext('2d'), mbody = $('#mbody');
const countIn = $('#countIn'), displayWrap = $('#displayWrap'), minusBtn = $('#minusBtn'), plusBtn = $('#plusBtn'), startBtn = $('#startBtn');
const msgEl = $('#msg'), tray = $('#tray'), trayCount = $('#trayCount'), trayWrap = $('#trayWrap'), fastChk = $('#fastChk');
const saveBtn = $('#saveBtn'), shareBtn = $('#shareBtn'), copyBtn = $('#copyBtn');

const M = {
  balls:[], games:[], exiting:[], air:[],
  drawing:false, wind:0, windTarget:0, geo:null, layers:null, gloss:null,
  running:false, lastT:0, lastDrawAt:null, imageCache:null, speed:1
};

/* ---- 공 그리기 ---- */
function fitText(g, text, maxW, start, min, weight = 700){
  let size = start;
  const setF = s => { g.font = `${weight} ${s}px ${FONT}`; };
  setF(size);
  let w = g.measureText(text).width;
  if (w > maxW){ size = Math.max(min, size * maxW / w); setF(size); }
  return { size, text, font:g.font };
}
function drawBallBase(g, x, y, r, ci, label){
  const C = COLORS[ci];
  const grd = g.createRadialGradient(x, y, r * 0.1, x, y, r);
  grd.addColorStop(0, C.light); grd.addColorStop(0.55, C.base); grd.addColorStop(1, C.dark);
  g.fillStyle = grd;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  if (!label) return;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (r >= 12){
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(x, y, r * 0.62, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = Math.max(1, r * 0.03); g.stroke();
    const f = fitText(g, label, r * 1.05, r * 0.6, Math.max(5, r * 0.3), 900);
    g.font = f.font; g.fillStyle = '#1d1d1f';
    g.fillText(f.text, x, y + r * 0.04);
  } else {
    const f = fitText(g, label, r * 1.7, r * 0.9, 4, 900);
    g.font = f.font;
    g.lineJoin = 'round'; g.lineWidth = Math.max(1.5, f.size * 0.22); g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.strokeText(f.text, x, y + r * 0.04);
    g.fillStyle = '#fff'; g.fillText(f.text, x, y + r * 0.04);
  }
}
function drawBallGloss(g, x, y, r){
  let grd = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.05, x, y, r);
  grd.addColorStop(0, 'rgba(255,255,255,0.32)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0)');
  grd.addColorStop(0.82, 'rgba(0,0,0,0.10)');
  grd.addColorStop(1, 'rgba(0,0,0,0.38)');
  g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.save();
  g.translate(x - r * 0.4, y - r * 0.46); g.rotate(-0.6); g.scale(1, 0.6);
  const s = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.34);
  s.addColorStop(0, 'rgba(255,255,255,0.92)'); s.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = s; g.beginPath(); g.arc(0, 0, r * 0.34, 0, Math.PI * 2); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.2)'; g.lineWidth = Math.max(1, r * 0.05); g.lineCap = 'round';
  g.beginPath(); g.arc(x, y, r * 0.86, Math.PI * 0.12, Math.PI * 0.55); g.stroke();
}
function makeGloss(){
  const G = M.geo, size = Math.ceil((G.spriteR * 2 + 4) * G.dpr);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.scale(G.dpr, G.dpr);
  const h = size / G.dpr / 2; G.spriteHalf = h;
  drawBallGloss(x, h, h, G.spriteR);
  return c;
}
function makeSprite(b){
  const G = M.geo, size = Math.ceil((G.spriteR * 2 + 4) * G.dpr);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'); x.scale(G.dpr, G.dpr);
  const h = size / G.dpr / 2;
  drawBallBase(x, h, h, G.spriteR, b.ci, String(b.num));
  b.sprite = c;
}
function rebuildSprites(){ if (!M.geo) return; M.gloss = makeGloss(); M.balls.forEach(makeSprite); }
function drawBallAt(b, x, y, r, ang){
  const G = M.geo, half = G.spriteHalf * (r / G.spriteR);
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.drawImage(b.sprite, -half, -half, half * 2, half * 2);
  ctx.restore();
  ctx.drawImage(M.gloss, x - half, y - half, half * 2, half * 2);
}

/* ---- 레이아웃 ---- */
function ballRadius(n, R){ return clamp(R * Math.sqrt(0.40 / Math.max(n, 1)), 7, R * 0.2); }

function buildPath(G){
  const pts = [], step = 2;
  const addLine = (x0, y0, x1, y1) => {
    const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(L / step));
    for (let i = pts.length ? 1 : 0; i <= n; i++) pts.push({ x:x0 + (x1 - x0) * i / n, y:y0 + (y1 - y0) * i / n });
  };
  const addArc = (ax, ay, r, a0, a1) => {
    const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * r / step));
    for (let i = 1; i <= n; i++){ const t = a0 + (a1 - a0) * i / n; pts.push({ x:ax + Math.cos(t) * r, y:ay + Math.sin(t) * r }); }
  };
  const { cx, cy, R, tubeR, topY, a, tubeX, H } = G;
  const endY = H - tubeR - 2;
  addLine(cx, cy - R + tubeR + 4, cx, topY);
  addArc(cx + a, topY, a, Math.PI, Math.PI * 1.5);
  addLine(cx + a, topY - a, tubeX - a, topY - a);
  addArc(tubeX - a, topY, a, Math.PI * 1.5, Math.PI * 2);
  addLine(tubeX, topY, tubeX, endY);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const len = cum[cum.length - 1];
  const vertStart = len - (endY - topY);
  return { pts, cum, len, sPause: vertStart + (len - vertStart) * 0.42 };
}
function pointAt(s){
  const { pts, cum, len } = M.geo.path;
  s = clamp(s, 0, len);
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (cum[mid] < s) lo = mid; else hi = mid; }
  const seg = cum[hi] - cum[lo] || 1, t = (s - cum[lo]) / seg;
  return { x:lerp(pts[lo].x, pts[hi].x, t), y:lerp(pts[lo].y, pts[hi].y, t) };
}

function roundRectPath(g, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function metalGrad(g, x0, x1){
  const m = g.createLinearGradient(x0, 0, x1, 0);
  m.addColorStop(0, '#5d6570'); m.addColorStop(0.2, '#d9dee4'); m.addColorStop(0.45, '#9aa3ae');
  m.addColorStop(0.7, '#eef1f4'); m.addColorStop(1, '#666e79');
  return m;
}

function buildLayers(){
  const G = M.geo;
  const mk = () => { const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; const x = c.getContext('2d'); x.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); return [c, x]; };
  const [bk, b] = mk(), [fr, f] = mk();
  const { cx, cy, R, a, topY, tubeX, H, tubeR } = G;
  const tw = tubeR * 2 + 4;

  const tube = new Path2D();
  tube.moveTo(cx, cy - R + 2); tube.lineTo(cx, topY);
  tube.arc(cx + a, topY, a, Math.PI, Math.PI * 1.5);
  tube.lineTo(tubeX - a, topY - a);
  tube.arc(tubeX - a, topY, a, Math.PI * 1.5, Math.PI * 2);
  tube.lineTo(tubeX, H - 2);

  const o = tw * 0.3, hl = new Path2D();
  hl.moveTo(cx - o, cy - R - 2); hl.lineTo(cx - o, topY);
  hl.arc(cx + a, topY, a + o, Math.PI, Math.PI * 1.5);
  hl.lineTo(tubeX - a, topY - a - o);
  hl.arc(tubeX - a, topY, a + o, Math.PI * 1.5, Math.PI * 2);
  hl.lineTo(tubeX + o, H - 12);

  b.lineJoin = 'round'; b.lineCap = 'butt';
  b.strokeStyle = 'rgba(200,230,255,0.55)'; b.lineWidth = tw + 4; b.stroke(tube);
  b.strokeStyle = '#0f1934'; b.lineWidth = tw; b.stroke(tube);
  b.strokeStyle = 'rgba(130,180,255,0.10)'; b.stroke(tube);

  let gr = b.createRadialGradient(cx, cy - R * 0.2, R * 0.1, cx, cy, R);
  gr.addColorStop(0, 'rgba(150,190,255,0.05)'); gr.addColorStop(0.75, 'rgba(150,190,255,0.10)'); gr.addColorStop(1, 'rgba(190,220,255,0.24)');
  b.fillStyle = gr; b.beginPath(); b.arc(cx, cy, R, 0, Math.PI * 2); b.fill();
  b.save(); b.beginPath(); b.arc(cx, cy, R, 0, Math.PI * 2); b.clip();
  gr = b.createRadialGradient(cx, cy + R, 0, cx, cy + R, R * 0.75);
  gr.addColorStop(0, 'rgba(120,200,255,0.22)'); gr.addColorStop(1, 'rgba(120,200,255,0)');
  b.fillStyle = gr; b.fillRect(cx - R, cy, R * 2, R);
  b.restore();

  const pw1 = R * 0.62, pw2 = R * 1.05, py1 = cy + R - 5, py2 = G.bodyTop + 2;
  f.beginPath(); f.moveTo(cx - pw1 / 2, py1); f.lineTo(cx + pw1 / 2, py1); f.lineTo(cx + pw2 / 2, py2); f.lineTo(cx - pw2 / 2, py2); f.closePath();
  f.fillStyle = metalGrad(f, cx - pw2 / 2, cx + pw2 / 2); f.fill();
  f.beginPath(); f.ellipse(cx, py1, pw1 / 2 + 8, 7, 0, 0, Math.PI * 2);
  f.fillStyle = metalGrad(f, cx - pw1 / 2 - 8, cx + pw1 / 2 + 8); f.fill();
  f.strokeStyle = 'rgba(0,0,0,0.3)'; f.lineWidth = 1; f.stroke();

  gr = f.createRadialGradient(cx, cy, R * 0.78, cx, cy, R);
  gr.addColorStop(0, 'rgba(200,230,255,0)'); gr.addColorStop(0.8, 'rgba(200,230,255,0.16)'); gr.addColorStop(1, 'rgba(255,255,255,0.42)');
  f.fillStyle = gr; f.beginPath(); f.arc(cx, cy, R, 0, Math.PI * 2); f.fill();
  f.strokeStyle = 'rgba(255,255,255,0.55)'; f.lineWidth = 2; f.beginPath(); f.arc(cx, cy, R - 1, 0, Math.PI * 2); f.stroke();
  f.save(); f.translate(cx - R * 0.38, cy - R * 0.48); f.rotate(-0.7); f.scale(1, 0.45);
  gr = f.createRadialGradient(0, 0, 0, 0, 0, R * 0.45);
  gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  f.fillStyle = gr; f.beginPath(); f.arc(0, 0, R * 0.45, 0, Math.PI * 2); f.fill();
  f.restore();
  f.lineCap = 'round';
  f.strokeStyle = 'rgba(255,255,255,0.28)'; f.lineWidth = Math.max(3, R * 0.045);
  f.beginPath(); f.arc(cx, cy, R * 0.9, -Math.PI * 0.22, Math.PI * 0.18); f.stroke();
  f.strokeStyle = 'rgba(255,255,255,0.12)'; f.lineWidth = Math.max(2, R * 0.03);
  f.beginPath(); f.arc(cx, cy, R * 0.88, Math.PI * 0.62, Math.PI * 0.86); f.stroke();
  f.fillStyle = 'rgba(255,255,255,0.9)'; f.beginPath(); f.arc(cx - R * 0.56, cy - R * 0.52, Math.max(2, R * 0.03), 0, Math.PI * 2); f.fill();

  roundRectPath(f, cx - tw / 2 - 6, cy - R - 12, tw + 12, 18, 5);
  f.fillStyle = metalGrad(f, cx - tw / 2 - 6, cx + tw / 2 + 6); f.fill();
  f.lineCap = 'round'; f.lineJoin = 'round';
  f.strokeStyle = 'rgba(255,255,255,0.32)'; f.lineWidth = 2; f.stroke(hl);
  roundRectPath(f, tubeX - tw / 2 - 5, H - 12, tw + 10, 12, 4);
  f.fillStyle = metalGrad(f, tubeX - tw / 2 - 5, tubeX + tw / 2 + 5); f.fill();

  M.layers = { bk, fr };
}

const compactMQ = window.matchMedia('(max-width: 640px)');
const isCompact = () => compactMQ.matches;
function layout(){
  const W = stage.clientWidth;
  if (!W) return;
  const tubeR = Math.round(clamp(W * 0.03, 11, 17));
  const tubeCol = Math.round(clamp(W * 0.15, 46, 78));
  const areaW = W - tubeCol;
  const a = tubeR + 10, neck = 20;
  const cx = Math.round(areaW / 2 + 6);
  let R, topY, cy, bodyTop, H;
  if (isCompact()){
    mbody.style.marginTop = ''; mbody.style.marginRight = '';
    mbody.style.right = tubeCol + 'px';
    H = stage.clientHeight;
    bodyTop = H - 10 - mbody.offsetHeight;
    R = Math.round(clamp((bodyTop - 16 - (tubeR + 8 + a) - neck) / 2, 40, Math.min(areaW * 0.46, 240)));
    cy = bodyTop - 16 - R;
    topY = cy - R - neck;
  } else {
    mbody.style.right = '';
    R = Math.round(Math.min(areaW * 0.46, 240));
    topY = tubeR + 8 + a;
    cy = topY + neck + R;
    bodyTop = cy + R + 16;
    mbody.style.marginTop = bodyTop + 'px';
    mbody.style.marginRight = tubeCol + 'px';
    H = stage.clientHeight;
  }
  const old = M.geo;
  if (old && old.W === W && old.H === H) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const G = { W, H, dpr, tubeR, tubeCol, R, a, neck, topY, cx, cy, bodyTop, tubeX:W - tubeCol / 2 };
  G.path = buildPath(G);
  G.r = ballRadius(M.balls.length, R);
  G.spriteR = Math.max(G.r, tubeR);

  if (old){
    const k = R / old.R;
    M.balls.forEach(b => {
      if (b.inDome && !b.exit){ b.x = cx + (b.x - old.cx) * k; b.y = cy + (b.y - old.cy) * k; b.vx *= k; b.vy *= k; }
    });
  }
  M.balls.forEach(b => { b.r = G.r; });
  M.geo = G;
  buildLayers();
  if (!old || old.spriteR !== G.spriteR || old.dpr !== G.dpr || !M.gloss) rebuildSprites();
  else G.spriteHalf = old.spriteHalf;
  if (!old) M.balls.forEach(b => { if (b.inDome && !b.exit) scatterBall(b, false); });
  document.body.style.setProperty('--chute', (W - G.tubeX) + 'px');
}
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(stage);
else window.addEventListener('resize', layout);

/* ---- 물리: 바닥 송풍구의 상승 기류 + 벽을 따라 내려오는 순환 ---- */
const jetX = t => 0.13 * Math.sin(t * 1.3) + 0.08 * Math.sin(t * 3.1 + 1); // 기류 중심이 좌우로 흔들림
function physics(act, h, t){
  const { cx, cy, R } = M.geo, G = 7.5 * R, w = M.wind, mixing = w > 0.05;
  const e = mixing ? 0.9 : 0.35;
  const damp = mixing ? 0 : 1.6;
  const vmax = R * 9;
  const kd = 3.6 * w;                   // 공기 저항: 공이 기류 속도를 따라가려는 정도
  const jx = jetX(t);
  const pulse = 0.85 + 0.15 * Math.sin(t * 7.3) + 0.1 * Math.sin(t * 2.1);
  for (const b of act){
    let ax = 0, ay = G;
    if (mixing){
      const u = (b.x - cx) / R - jx, v = (b.y - cy) / R;
      const core = Math.exp(-(u * u) / 0.09);
      const lower = clamp((v + 1) / 2, 0, 1);
      let fx = 0, fy = 0;
      fy -= R * 6.5 * core * (0.4 + 0.8 * lower) * pulse;           // 중앙 상승 기류 (아래일수록 강함)
      fy += R * 2.2 * (1 - core) * Math.max(0, Math.abs(u) - 0.3);  // 벽 쪽 하강
      fx += u * R * 3.5 * Math.max(0, -v);                          // 위쪽: 바깥으로 퍼짐
      fx -= u * R * 3.0 * Math.max(0, v - 0.2);                     // 아래쪽: 송풍구로 모임
      fx += R * 2.2 * Math.sin(t * 2.7 + v * 6 + b.ph);             // 난류
      fy += R * 1.6 * Math.sin(t * 3.3 + u * 7 + b.ph * 1.7);
      ax += kd * (fx - b.vx); ay += kd * (fy - b.vy);
      if (Math.random() < 0.02 * w){ b.vx += (Math.random() - 0.5) * R * 2.5; b.vy -= Math.random() * R * 1.5; b.va += (Math.random() - 0.5) * 30; }
    }
    b.vx += ax * h; b.vy += ay * h;
    if (damp){ const f = 1 - damp * h; b.vx *= f; b.vy *= f; }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > vmax){ b.vx *= vmax / sp; b.vy *= vmax / sp; }
    b.x += b.vx * h; b.y += b.vy * h;
  }
  const n = act.length;
  for (let i = 0; i < n; i++){
    const p = act[i];
    for (let j = i + 1; j < n; j++){
      const q = act[j];
      let dx = q.x - p.x, dy = q.y - p.y;
      const rs = p.r + q.r;
      let d2 = dx * dx + dy * dy;
      if (d2 >= rs * rs) continue;
      if (d2 < 1e-6){ dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = dx * dx + dy * dy; }
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (rs - d) * 0.5;
      p.x -= nx * ov; p.y -= ny * ov; q.x += nx * ov; q.y += ny * ov;
      const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rv < 0){
        const jj = -(1 + e) * rv * 0.5;
        p.vx -= jj * nx; p.vy -= jj * ny; q.vx += jj * nx; q.vy += jj * ny;
        const rt = -(q.vx - p.vx) * ny + (q.vy - p.vy) * nx;   // 스치며 부딪히면 회전이 붙음
        p.va += rt / p.r * 0.2; q.va += rt / q.r * 0.2;
      }
    }
  }
  for (const b of act){
    const dx = b.x - cx, dy = b.y - cy, lim = R - b.r - 3, d2 = dx * dx + dy * dy;
    if (d2 > lim * lim){
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      b.x = cx + nx * lim; b.y = cy + ny * lim;
      const vn = b.vx * nx + b.vy * ny;
      if (vn > 0){ b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
      b.vx *= 0.995; b.vy *= 0.995;
      const vt = -b.vx * ny + b.vy * nx;                        // 벽을 따라 구르기
      b.va += (vt / b.r - b.va) * 0.3;
    }
  }
}

/* ---- 공 배출 ---- */
function exitBall(b, pause){
  const sp = M.speed;
  return new Promise(resolve => {
    b.exit = { phase:'suck', t0:performance.now(), r0:b.r, pause:pause * sp, resolve, tubeDur:900 * sp };
    b.drawR = b.r;
    M.exiting.push(b);
  });
}
function updateExit(b, now, dt){
  const ex = b.exit, G = M.geo, L = G.path.len;
  if (ex.phase === 'suck'){ // 기류에 실려 출구 쪽으로 빨려 올라감
    const p0 = G.path.pts[0], el = now - ex.t0;
    const dx = p0.x - b.x, dy = p0.y - b.y, d = Math.hypot(dx, dy) || 1;
    const spd = G.R * (2.5 + el / 1000 * 10 / M.speed);
    const k = Math.min(1, dt * 7);
    b.vx += ((dx / d) * spd - b.vx) * k; b.vy += ((dy / d) * spd - b.vy) * k;
    const move = Math.hypot(b.vx, b.vy) * dt;
    b.drawR = lerp(G.tubeR, ex.r0, clamp(d / (G.R * 0.6), 0, 1));
    b.va = lerp(b.va, 25, k * 0.5); b.ang += b.va * dt;
    if (d <= Math.max(move * 1.2, G.tubeR * 0.6) || el > 1500 * M.speed){
      b.x = p0.x; b.y = p0.y; ex.phase = 'tube'; ex.t0 = now; ex.a0 = b.ang;
    } else { b.x += b.vx * dt; b.y += b.vy * dt; }
    return;
  }
  const el = now - ex.t0;
  let s, off = 0, done = false;
  if (ex.pause > 0){ // 마지막 공: 튜브에서 잠깐 멈췄다가 내려옴
    const tA = ex.tubeDur, tP = ex.pause, tB = ex.tubeDur * 0.7, sp = G.path.sPause;
    if (el < tA) s = sp * easeInOutSine(el / tA);
    else if (el < tA + tP){ s = sp; off = Math.sin(el * 0.045) * 1.6; }
    else if (el < tA + tP + tB){ const u = (el - tA - tP) / tB; s = sp + (L - sp) * u * u; }
    else { s = L; done = true; }
  } else {
    const u = clamp(el / ex.tubeDur, 0, 1);
    s = L * (0.55 * u * u + 0.45 * u);
    if (u >= 1){ s = L; done = true; }
  }
  const p = pointAt(s);
  b.x = p.x + off; b.y = p.y; b.drawR = G.tubeR;
  b.ang = ex.a0 + s / G.tubeR;
  if (done){
    M.exiting.splice(M.exiting.indexOf(b), 1);
    b.inDome = false;
    const r = ex.resolve; b.exit = null; r();
  }
}

/* ---- 메인 루프 ---- */
function step(dt, now){
  const t = now / 1000, G = M.geo;
  M.wind += (M.windTarget - M.wind) * Math.min(1, dt * (M.windTarget > M.wind ? 1.6 : 2.5)); // 송풍기 가동/정지에 시간이 걸림
  const act = M.balls.filter(b => b.inDome && !b.exit);
  const steps = 3, h = dt / steps;
  for (let s = 0; s < steps; s++) physics(act, h, t + s * h);
  const calm = M.wind < 0.05;
  if (calm && !M.drawing && act.length && Math.random() < 0.06){
    const b = act[(Math.random() * act.length) | 0];
    b.vx += (Math.random() - 0.5) * G.R * 0.5; b.vy -= Math.random() * G.R * 0.35;
  }
  for (const b of act){
    if (calm) b.va += (b.vx / b.r - b.va) * Math.min(1, dt * 5);
    b.ang += b.va * dt;
    b.va *= 1 - Math.min(1, (calm ? 2 : 0.5) * dt);
    if (calm && Math.abs(b.vx) + Math.abs(b.vy) < 25){ b.ang = wrapAngle(b.ang) * 0.9; b.va *= 0.8; }
  }
  // 송풍구에서 올라오는 공기 흐름 표시
  if (M.wind > 0.2){
    const jx = G.cx + jetX(t) * G.R, n = Math.round(3 * M.wind);
    for (let i = 0; i < n; i++) M.air.push({ x:jx + (Math.random() - 0.5) * G.R * 0.3, y:G.cy + G.R * 0.92, vx:(Math.random() - 0.5) * G.R * 0.8, vy:-G.R * (4 + Math.random() * 3), life:0 });
  }
  for (const a of M.air){ a.x += a.vx * dt; a.y += a.vy * dt; a.life += dt / 0.6; }
  M.air = M.air.filter(a => a.life < 1 && a.y > G.cy - G.R);
  for (const b of M.exiting.slice()) updateExit(b, now, dt);
}
function render(){
  const G = M.geo; if (!G || !M.layers) return;
  const shake = M.wind > 0.3 ? M.wind * 1.4 : 0;            // 송풍기 진동
  const ox = (Math.random() - 0.5) * shake * G.dpr, oy = (Math.random() - 0.5) * shake * G.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  ctx.drawImage(M.layers.bk, 0, 0);
  ctx.setTransform(G.dpr, 0, 0, G.dpr, ox, oy);
  if (M.air.length){
    ctx.save();
    ctx.beginPath(); ctx.arc(G.cx, G.cy, G.R - 2, 0, Math.PI * 2); ctx.clip();
    ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (const a of M.air){
      ctx.strokeStyle = `rgba(200,235,255,${(0.22 * (1 - a.life) * M.wind).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - a.vx * 0.03, a.y - a.vy * 0.03); ctx.stroke();
    }
    ctx.restore();
  }
  for (const b of M.balls) if (b.inDome && !b.exit) drawBallAt(b, b.x, b.y, b.r, b.ang);
  for (const b of M.exiting) drawBallAt(b, b.x, b.y, b.drawR, b.ang);
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  ctx.drawImage(M.layers.fr, 0, 0);
}
function loop(now){
  const dt = Math.min((now - M.lastT) / 1000, 1 / 30);
  M.lastT = now;
  if (M.geo){ step(dt, now); render(); }
  requestAnimationFrame(loop);
}

/* ---- UI ---- */
function setMarquee(){
  const track = $('#marqueeTrack');
  const unit = `★ 로또 6/45 번호 추첨 ★ 행운을 빕니다   `;
  track.innerHTML = '';
  for (let i = 0; i < 2; i++){ const s = document.createElement('span'); s.textContent = unit.repeat(4); track.appendChild(s); }
  requestAnimationFrame(() => {
    const w = track.firstChild ? track.firstChild.offsetWidth : 1000;
    track.style.setProperty('--dur', Math.max(8, w / 75) + 's');
  });
}
function showMsg(t, err){ msgEl.textContent = t || ''; msgEl.classList.toggle('err', !!err); }
function invalidInput(t){
  showMsg(t, true);
  displayWrap.classList.remove('shake'); void displayWrap.offsetWidth;
  displayWrap.classList.add('shake', 'err');
  countIn.focus(); countIn.select();
}
displayWrap.addEventListener('animationend', () => displayWrap.classList.remove('shake'));

function setControls(on){
  countIn.disabled = !on; minusBtn.disabled = !on; plusBtn.disabled = !on; startBtn.disabled = !on; fastChk.disabled = !on;
}
function updateActions(){
  const has = M.games.length > 0 && !M.drawing;
  saveBtn.disabled = shareBtn.disabled = copyBtn.disabled = !has;
}
function resetTray(){
  tray.innerHTML = '<div class="tray-empty">[추첨 시작]을 누르면 번호가 여기에 놓여요</div>';
  trayCount.textContent = '';
}
function makeLottoBall(n){
  const C = COLORS[colorOf(n)];
  const el = document.createElement('div');
  el.className = 'lb arrive glow';
  el.style.setProperty('--c', C.base); el.style.setProperty('--d', C.dark);
  const s = document.createElement('span'); s.textContent = n;
  el.appendChild(s);
  setTimeout(() => el.classList.remove('glow'), 1400);
  return el;
}
function addGameRow(idx){
  const empty = tray.querySelector('.tray-empty'); if (empty) empty.remove();
  const g = document.createElement('div'); g.className = 'game';
  const row = document.createElement('div'); row.className = 'grow';
  const lab = document.createElement('span'); lab.className = 'glabel'; lab.textContent = GAME_LABELS[idx];
  const nums = document.createElement('div'); nums.className = 'nums';
  for (let i = 0; i < PICK; i++){ const s = document.createElement('div'); s.className = 'slot'; nums.appendChild(s); }
  row.append(lab, nums);
  const order = document.createElement('div'); order.className = 'order';
  g.append(row, order);
  tray.appendChild(g);
  return { el:g, nums, order };
}
function fillSlot(slot, n){
  slot.classList.add('filled'); slot.dataset.n = n;
  slot.setAttribute('aria-label', String(n));
  slot.appendChild(makeLottoBall(n));
}
function sortRow(row){ // 뽑힌 순서 → 오름차순 (FLIP 애니메이션)
  const items = [...row.nums.children];
  const first = new Map(items.map(el => [el, el.getBoundingClientRect().left]));
  items.slice().sort((a, b) => a.dataset.n - b.dataset.n).forEach(el => row.nums.appendChild(el));
  items.forEach(el => {
    const dx = first.get(el) - el.getBoundingClientRect().left;
    if (dx && el.animate) el.animate([{ transform:`translateX(${dx}px)` }, { transform:'none' }], { duration:650, easing:'cubic-bezier(.3,1.25,.5,1)' });
  });
}

function scatterBall(b, upperOnly){
  const { cx, cy, R, r } = M.geo;
  const ang = Math.random() * Math.PI * 2, rad = Math.sqrt(Math.random()) * (R - r - 4);
  b.x = cx + Math.cos(ang) * rad;
  b.y = upperOnly ? cy - Math.abs(Math.sin(ang)) * rad * 0.9 : cy + Math.sin(ang) * rad * 0.9 - R * 0.1;
  b.vx = (Math.random() - 0.5) * 60; b.vy = 0; b.ang = (Math.random() - 0.5) * 2;
}
function returnAllBalls(){
  if (!M.geo) return;
  M.balls.forEach(b => { if (!b.inDome){ b.inDome = true; b.r = M.geo.r; scatterBall(b, true); } });
}

function initMachine(){
  M.balls = Array.from({ length:MAX_NUM }, (_, i) => ({ num:i + 1, ci:colorOf(i + 1), x:0, y:0, vx:0, vy:0, r:10, ang:0, va:0, ph:Math.random() * Math.PI * 2, drawR:10, inDome:true, exit:null, sprite:null }));
  setMarquee();
  resetTray();
  layout();
  setControls(true); updateActions();
  showMsg('게임 수(1~5)를 정하고 [추첨 시작]을 누르세요');
  M.lastT = performance.now();
  requestAnimationFrame(loop);
  ensureFonts('0123456789').then(rebuildSprites);
}

async function startDraw(){
  if (M.drawing) return;
  const raw = countIn.value.trim();
  const k = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
  if (!(k >= 1 && k <= MAX_GAMES)){ invalidInput(`게임 수는 1 ~ ${MAX_GAMES} 사이로 입력해 주세요`); return; }
  displayWrap.classList.remove('err');

  // 모든 게임의 번호를 애니메이션 전에 확정 (게임별 독립, 게임 안에서는 비복원)
  const all = Array.from({ length:MAX_NUM }, (_, i) => i + 1);
  const plan = Array.from({ length:k }, () => shuffle(all).slice(0, PICK));

  M.speed = fastChk.checked ? 0.45 : 1;
  const sp = M.speed;
  M.drawing = true; M.imageCache = null; M.games = []; M.lastDrawAt = new Date();
  setControls(false); updateActions();
  resetTray();
  tray.style.setProperty('--rows', k);   // 휴대폰: 결과 칸 높이를 미리 잡아 두어 추첨 중에 돔 크기가 바뀌지 않게
  returnAllBalls();
  announce(`${k}게임 추첨을 시작합니다.`);

  for (let gi = 0; gi < plan.length; gi++){
    const order = plan[gi], label = GAME_LABELS[gi];
    if (gi > 0){
      tray.querySelectorAll('.game').forEach(el => el.classList.add('done'));
      showMsg(`공을 돔으로 되돌립니다… (${label}게임 준비)`);
      returnAllBalls();
      await sleep(900 * sp);
    }
    M.windTarget = 1; mbody.classList.add('rattle');
    showMsg(`${label}게임 · 송풍기 가동! 공을 섞는 중…`);
    const row = addGameRow(gi);
    trayCount.textContent = `${gi + 1} / ${k}게임`;
    await sleep((gi === 0 ? 3500 : 2600) * sp);

    for (let i = 0; i < PICK; i++){
      const n = order[i], b = M.balls[n - 1], last = i === PICK - 1;
      showMsg(last ? `${label}게임 · 마지막 공!` : `${label}게임 · ${i + 1}번째 공이 나옵니다…`);
      await exitBall(b, last ? 1000 : 0);
      fillSlot(row.nums.children[i], n);
      announce(`${label}게임 ${i + 1}번째 번호 ${n}`);
      if (!last) await sleep(250 * sp);
    }
    M.windTarget = 0; mbody.classList.remove('rattle');

    await sleep(500 * sp);
    sortRow(row);
    const sorted = order.slice().sort((a, b) => a - b);
    row.order.textContent = `추첨 순서 ${order.join(' · ')}`;
    M.games.push({ label, order, sorted });
    announce(`${label}게임 결과: ${sorted.join(', ')}`);
    await sleep(700 * sp);
  }

  M.drawing = false;
  setControls(true); updateActions();
  startBtn.textContent = '다시 추첨';
  showMsg(`추첨 완료! ${k}게임`);
  M.imageCache = buildImageBlob().catch(() => null);
  confetti();
  announce(`추첨 완료. ${resultText()}`);
  trayWrap.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ---- 색종이 ---- */
function confetti(){
  const cv = $('#confetti'), g = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.display = 'block';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ffd400', '#ff4d6d', '#4dabf7', '#51cf66', '#ffffff', '#ff922b', '#cc5de8'];
  const sc = Math.max(0.7, H / 800), ps = [];
  const mk = (x, y, vx, vy) => ({ x, y, vx, vy, w:6 + Math.random() * 7, h:9 + Math.random() * 9, rot:Math.random() * 6, vr:(Math.random() - 0.5) * 12, flip:Math.random() * 6, vf:5 + Math.random() * 8, c:cols[(Math.random() * cols.length) | 0] });
  for (let i = 0; i < 160; i++){
    const left = i % 2 === 0;
    ps.push(mk(left ? -10 : W + 10, H * 0.78, (left ? 1 : -1) * (250 + Math.random() * 650) * sc, -(650 + Math.random() * 650) * sc));
  }
  for (let i = 0; i < 60; i++) ps.push(mk(Math.random() * W, -20 - Math.random() * H * 0.5, (Math.random() - 0.5) * 120, 100 + Math.random() * 200));
  let last = performance.now(); const start = last;
  (function frame(now){
    const dt = Math.min((now - last) / 1000, 0.033); last = now;
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of ps){
      p.vy += 560 * dt; if (p.vy > 300) p.vy = 300;
      p.vx *= (1 - 1.4 * dt);
      p.x += p.vx * dt + Math.sin(p.flip) * 0.6; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      if (p.y < H + 30) alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.flip));
      g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    }
    if (alive && now - start < 7000) requestAnimationFrame(frame);
    else { g.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(start);
}

/* ---- 결과 텍스트 / 이미지 ---- */
function kst(d){
  const k = new Date(d.getTime() + 9 * 3600 * 1000);
  const p = n => String(n).padStart(2, '0');
  return { Y:k.getUTCFullYear(), M:p(k.getUTCMonth() + 1), D:p(k.getUTCDate()), h:p(k.getUTCHours()), m:p(k.getUTCMinutes()), w:'일월화수목금토'[k.getUTCDay()] };
}
function fmtDate(d){ const t = kst(d); return `${t.Y}.${t.M}.${t.D} (${t.w}) ${t.h}:${t.m}`; }
function fileName(){ const t = kst(M.lastDrawAt || new Date()); return `로또번호_${t.Y}${t.M}${t.D}_${t.h}${t.m}.png`; }
function resultText(){
  const head = `로또 6/45 번호 추첨 (${fmtDate(M.lastDrawAt || new Date())})`;
  return [head, ...M.games.map(g => `${g.label}: ${g.sorted.join(' ')}`)].join('\n');
}

async function buildImageBlob(){
  const W = 1080, H = 1350;
  const games = M.games.slice(), at = M.lastDrawAt || new Date();
  await ensureFonts('로또6/45번호추첨일시게임순서중개무작위비복원재미로뽑은이며실제당첨확률과는무관합니다0123456789ABCDE().:·+|LUCKYDRAW');
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');

  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1b2353'); gr.addColorStop(1, '#0a0e24');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 0.7); gr.addColorStop(0, 'rgba(255,215,90,0.16)'); gr.addColorStop(1, 'rgba(255,215,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.35;
  [[80, 70, 40, 0], [150, 40, 18, 1], [W - 85, 90, 34, 2], [W - 160, 44, 18, 4], [W - 50, 180, 14, 3]].forEach(([x, y, r, ci]) => { drawBallBase(g, x, y, r, ci, ''); drawBallGloss(g, x, y, r); });
  g.globalAlpha = 1;

  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffd45a'; g.font = `800 26px ${FONT}`;
  g.fillText('L U C K Y   D R A W', W / 2, 92);
  g.font = `900 76px ${FONT}`; g.fillStyle = '#ffffff'; g.fillText('로또 6/45 번호 추첨', W / 2, 178);
  g.fillStyle = '#ffd45a'; roundRectPath(g, W / 2 - 60, 204, 120, 6, 3); g.fill();
  g.font = `600 32px ${FONT}`; g.fillStyle = '#b8c2ea';
  g.fillText(`추첨 일시  ${fmtDate(at)}`, W / 2, 262);

  // 게임별 결과 (오름차순)
  const areaTop = 310, areaBottom = 1170;
  const br = 56, gap = 14, labW = 64;
  const rowW = labW + 22 + PICK * br * 2 + (PICK - 1) * gap;
  const rowH = Math.min(176, (areaBottom - areaTop) / Math.max(games.length, 1));
  const y0 = areaTop + ((areaBottom - areaTop) - rowH * games.length) / 2;
  const x0 = (W - rowW) / 2;
  games.forEach((gm, i) => {
    const y = y0 + i * rowH, yc = y + rowH * 0.42;
    g.fillStyle = 'rgba(255,255,255,0.05)'; roundRectPath(g, x0 - 28, y + 8, rowW + 56, rowH - 16, 26); g.fill();
    g.fillStyle = '#ffd45a'; roundRectPath(g, x0, yc - labW / 2, labW, labW, 16); g.fill();
    g.fillStyle = '#2a1c00'; g.font = `900 38px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(gm.label, x0 + labW / 2, yc + 2);
    let x = x0 + labW + 22 + br;
    gm.sorted.forEach(n => { drawBallBase(g, x, yc, br, colorOf(n), String(n)); drawBallGloss(g, x, yc, br); x += br * 2 + gap; });
    g.font = `600 22px ${FONT}`; g.fillStyle = '#8f9bc8'; g.textBaseline = 'alphabetic';
    g.fillText(`추첨 순서 ${gm.order.join(' · ')}`, W / 2, yc + br + 36);
  });

  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.strokeStyle = 'rgba(255,255,255,0.15)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(70, 1196); g.lineTo(W - 70, 1196); g.stroke();
  g.font = `700 28px ${FONT}`; g.fillStyle = '#d7def7';
  g.fillText(`${games.length}게임 · 1~45 중 6개 · 무작위 비복원 추첨`, W / 2, 1246);
  g.font = `500 22px ${FONT}`; g.fillStyle = '#8f9bc8';
  g.fillText('재미로 뽑은 번호이며 실제 당첨 확률과는 무관합니다', W / 2, 1288);

  const blob = await new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('toBlob failed')), 'image/png'));
  return { blob, name:fileName() };
}
async function getImage(){
  let r = M.imageCache ? await M.imageCache : null;
  if (!r){ M.imageCache = buildImageBlob(); r = await M.imageCache; }
  return r;
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const canShareFiles = (() => {
  try {
    if (!navigator.share || !navigator.canShare) return false;
    const f = new File([new Blob(['x'], { type:'image/png' })], 't.png', { type:'image/png' });
    return navigator.canShare({ files:[f] }) && window.matchMedia('(pointer: coarse)').matches;
  } catch(e){ return false; }
})();
if (canShareFiles){ shareBtn.classList.remove('hidden'); copyBtn.classList.add('wide'); }

saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  try { const r = await getImage(); downloadBlob(r.blob, r.name); toast('이미지를 저장했어요'); }
  catch(e){ toast('이미지 생성에 실패했어요'); }
  finally { updateActions(); }
});
shareBtn.addEventListener('click', async () => {
  let r;
  try { r = await getImage(); } catch(e){ toast('이미지 생성에 실패했어요'); return; }
  const file = new File([r.blob], r.name, { type:'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'로또 6/45 번호 추첨' }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  downloadBlob(r.blob, r.name); toast('공유를 지원하지 않아 이미지로 저장했어요');
});
copyBtn.addEventListener('click', async () => {
  const text = resultText();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  toast(ok ? '결과를 복사했어요' : '복사에 실패했어요');
});

startBtn.addEventListener('click', startDraw);
countIn.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); startDraw(); } });
countIn.addEventListener('input', () => {
  const v = countIn.value.replace(/\D/g, '').slice(0, 1);
  if (v !== countIn.value) countIn.value = v;
  if (msgEl.classList.contains('err')){ showMsg(''); displayWrap.classList.remove('err'); }
});
function bump(d){
  const v = parseInt(countIn.value, 10) || 0;
  countIn.value = String(clamp(v + d, 1, MAX_GAMES));
  if (msgEl.classList.contains('err')){ showMsg(''); displayWrap.classList.remove('err'); }
}
minusBtn.addEventListener('click', () => bump(-1));
plusBtn.addEventListener('click', () => bump(1));

document.addEventListener('visibilitychange', () => { M.lastT = performance.now(); });

initMachine();
})();
</script>
